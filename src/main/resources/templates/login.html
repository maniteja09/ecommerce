<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | ShopEase</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #111827;
        }


        /* Navbar */

        .navbar {
            background: #111827;
            color: white;

            padding: 20px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            font-size: 30px;
            font-weight: bold;
        }


        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }


        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }


        .nav-links a:hover {
            color: #60a5fa;
        }


        /* Main */

        .container {
            width: 90%;
            max-width: 500px;

            margin: 70px auto;
        }


        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }


        .page-header h1 {
            font-size: 44px;
            margin-bottom: 12px;
        }


        .page-header p {
            color: #64748b;
            font-size: 18px;
        }


        /* Login Card */

        .login-card {
            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                    0 8px 25px rgba(15, 23, 42, 0.08);
        }


        .login-icon {
            text-align: center;

            font-size: 65px;

            margin-bottom: 20px;
        }


        .form-group {
            margin-bottom: 22px;
        }


        label {
            display: block;

            margin-bottom: 9px;

            font-weight: bold;

            font-size: 16px;
        }


        input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }


        input:focus {
            border-color: #2563eb;

            box-shadow:
                    0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        /* Login Button */

        .login-btn {
            width: 100%;

            background: #2563eb;

            color: white;

            border: none;

            padding: 14px;

            border-radius: 8px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;
        }


        .login-btn:hover {
            background: #1d4ed8;
        }


        /* Links */

        .links {
            text-align: center;

            margin-top: 25px;
        }


        .links p {
            color: #64748b;

            margin-bottom: 12px;
        }


        .links a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }


        .links a:hover {
            text-decoration: underline;
        }


        .home-link {
            display: inline-block;

            margin-top: 18px;

            color: #111827 !important;

            background: #f1f5f9;

            padding: 10px 18px;

            border-radius: 8px;
        }


        .home-link:hover {
            background: #e2e8f0;

            text-decoration: none !important;
        }


        /* Error Message */

        .error-message {
            background: #fef2f2;

            color: #dc2626;

            border: 1px solid #fecaca;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
        }


        /* Footer */

        footer {
            background: #111827;

            color: white;

            text-align: center;

            padding: 25px;

            margin-top: 100px;
        }


        /* Mobile */

        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;

                gap: 15px;

                padding: 18px 5%;
            }


            .nav-links {
                gap: 15px;

                flex-wrap: wrap;

                justify-content: center;
            }


            .container {
                width: 95%;

                margin-top: 45px;
            }


            .login-card {
                padding: 28px 22px;
            }


            .page-header h1 {
                font-size: 36px;
            }

        }

    </style>

</head>


<body>


<!-- Navbar -->

<nav class="navbar">

    <div class="logo">
        🛒 ShopEase
    </div>


    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/products">
            Products
        </a>

        <a href="/register">
            Register
        </a>

    </div>

</nav>


<!-- Main -->

<div class="container">


    <div class="page-header">

        <h1>
            Welcome Back 👋
        </h1>

        <p>
            Login to your ShopEase account.
        </p>

    </div>


    <div class="login-card">


        <div class="login-icon">
            🔐
        </div>


        <!-- Login Error -->

        <div class="error-message"
             th:if="${param.error}">

            Invalid email or password.
            Please try again.

        </div>


        <!-- Logout Message -->

        <div class="error-message"
             th:if="${param.logout}"
             style="background:#f0fdf4;
                    color:#15803d;
                    border-color:#bbf7d0;">

            You have been logged out successfully.

        </div>


        <!-- Login Form -->

        <form action="/login"
              method="post">


            <div class="form-group">

                <label for="username">
                    Email
                </label>


                <input type="email"
                       id="username"
                       name="username"
                       placeholder="Enter your email"
                       autocomplete="email"
                       required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>

            </div>


            <button type="submit"
                    class="login-btn">

                🔐 Login

            </button>


        </form>


        <div class="links">

            <p>
                Don't have an account?
            </p>


            <a href="/register">
                Create an account →
            </a>


            <br>


            <a href="/"
               class="home-link">

                ← Back to Home

            </a>

        </div>


    </div>


</div>


<!-- Footer -->

<footer>

    © 2026 ShopEase. All Rights Reserved.

</footer>


</body>

</html>
