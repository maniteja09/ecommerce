<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | ShopEase</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #111827;
        }

        /* NAVBAR */

        .navbar {
            height: 76px;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .admin-btn {
            background: #2563eb;
            padding: 11px 18px;
            border-radius: 8px;
        }

        .logout {
            color: #ff8b8b !important;
        }

        /* PAGE HEADER */

        .page-header {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .page-header h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .page-header p {
            color: #64748b;
            font-size: 18px;
        }

        /* PROFILE CARD */

        .profile-container {
            width: 90%;
            max-width: 900px;
            margin: 0 auto 60px;
        }

        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .profile-top {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 1px solid #e5e7eb;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #e8efff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .profile-top h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .profile-top p {
            color: #64748b;
        }

        /* INFORMATION */

        .profile-info {
            margin-top: 30px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        .info-label {
            color: #64748b;
            font-size: 16px;
        }

        .info-value {
            font-weight: bold;
            font-size: 17px;
        }

        .role {
            background: #dbeafe;
            color: #2563eb;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* BUTTONS */

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 35px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .secondary-btn {
            background: #111827;
            color: white;
        }

        .secondary-btn:hover {
            background: #1f2937;
        }

        /* FOOTER */

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .navbar {
                height: auto;
                padding: 20px;
                flex-direction: column;
                gap: 20px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .page-header h1 {
                font-size: 34px;
            }

            .profile-card {
                padding: 25px;
            }

            .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        🛒 ShopEase
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/products">
            Products
        </a>

        <a href="/profile">
            Profile
        </a>

        <a href="/cart">
            Cart 🛒
        </a>

        <a href="/wishlist">
            Wishlist 💗
        </a>

        <a href="/orders">
            Orders
        </a>

        <a sec:authorize="hasRole('ADMIN')"
           href="/admin"
           class="admin-btn">
            Admin
        </a>

        <a href="/logout"
           class="logout">
            Logout
        </a>

    </div>

</nav>


<!-- PAGE HEADER -->

<section class="page-header">

    <h1>
        My Profile 👤
    </h1>

    <p>
        Manage and view your account information.
    </p>

</section>


<!-- PROFILE -->

<div class="profile-container">

    <div class="profile-card">

        <div class="profile-top">

            <div class="profile-icon">
                👤
            </div>

            <h2 th:text="${user.name}">
                User Name
            </h2>

            <p th:text="${user.email}">
                user@example.com
            </p>

        </div>


        <div class="profile-info">

            <div class="info-row">

                <span class="info-label">
                    Full Name
                </span>

                <span class="info-value"
                      th:text="${user.name}">
                    User Name
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Email Address
                </span>

                <span class="info-value"
                      th:text="${user.email}">
                    user@example.com
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Account Role
                </span>

                <span class="role"
                      th:text="${user.role}">
                    USER
                </span>

            </div>

        </div>


        <!-- ACTION BUTTONS -->

        <div class="actions">

            <a href="/orders"
               class="btn primary-btn">
                📦 My Orders
            </a>

            <a href="/products"
               class="btn secondary-btn">
                🛍 Continue Shopping
            </a>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    © 2026 ShopEase. All Rights Reserved.

</footer>


</body>

</html>
